version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
volumes:
  mongo_data_dev:
